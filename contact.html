<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="description" content="Get in touch with Threshold of Faith.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="index.html">Threshold of Faith</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="sermons.html">Sermons</a>
      <a href="books.html">Books</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<div class="page-intro">
  <h1>Get in touch</h1>
  <p>Questions, feedback, or a request for prayer — send a message below.</p>
</div>

<form class="contact-form" id="contact-form">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="message">Message</label>
  <textarea id="message" name="message" required></textarea>

  <button type="submit" class="btn btn-primary">Send message</button>
</form>

<footer class="site-footer">

    </nav>
  </div>
</footer>

<script src="main.js"></script>
<script>wireContactForm("contact-form", "you@example.com");</script>
</body>
</html>
